<!doctype html><meta charset=utf-8><title>Akazi</title><link rel=stylesheet href=style.css><main><div class=card><h2>Akazi</h2><div id=l>...</div></div></main><script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script><script src=config.js></script><script src=app.js></script><script>async function load(){await loginRequired();let r=await db.from('tasks').select('*').eq('status','open').order('created_at',{ascending:false});l.innerHTML=r.data?.length?r.data.map(x=>`<div class=card><h3>${x.title}</h3><p>${x.description}</p><b>${money(x.reward_rwf)}</b><button onclick="claim('${x.id}')">Fata akazi</button></div>`).join(''):'Nta kazi zihari ubu.'}async function claim(id){let r=await db.rpc('claim_task',{p_task:id});alert(r.error?.message||'Wafashe akazi');load()}load()</script>
