<!doctype html><meta charset=utf-8><title>Withdraw</title><link rel=stylesheet href=style.css><main><div class=card><h2>Withdraw</h2><select id=net><option>MTN</option><option>AIRTEL</option></select><input id=a type=number placeholder='Amafaranga'><input id=ph placeholder='Nimero uzakiriraho'><button onclick=send()>Saba Withdraw</button><p id=m></p></div></main><script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script><script src=config.js></script><script src=app.js></script><script>async function send(){await loginRequired();let r=await db.rpc('request_withdrawal',{p_network:net.value,p_amount:+a.value,p_phone:ph.value});m.textContent=r.error?r.error.message:'Ubusabe bwa withdraw bwakiriwe.'}</script>
