<!doctype html><html lang="rw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskPay - Ohereza</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f7fc;color:#172033}header{background:#087ff5;color:white;padding:18px 20px;font-size:28px;font-weight:800}nav{background:white;padding:10px;display:flex;gap:8px;overflow:auto}nav a{padding:11px 15px;border-radius:12px;text-decoration:none;color:#19304d;white-space:nowrap}nav a.active{background:#087ff5;color:white}main{max-width:650px;margin:auto;padding:20px}.card{background:white;border-radius:20px;padding:22px;box-shadow:0 4px 18px #17345b12}label{display:block;font-weight:700;margin:14px 0 7px}input,select{width:100%;padding:14px;border:1px solid #ccd6e2;border-radius:12px;font-size:16px}button{margin-top:18px;width:100%;padding:15px;background:#087ff5;color:#fff;border:0;border-radius:12px;font-weight:800;font-size:16px}</style></head>
<body><header>▣ TaskPay</header><nav><a href="index.html">Dashboard</a><a href="users.html">Abakoresha</a><a href="tasks.html">Akazi</a><a class="active" href="withdraw.html">Ohereza</a><a href="admin.html">Admin</a></nav>
<main><div class="card"><h2>Gukuramo / Ohereza amafaranga</h2><p>Balance: <b>RWF 45,000</b></p><label>Nomero ya telefone</label><input id="phone" placeholder="07xxxxxxxx"><label>Umubare (RWF)</label><input id="amount" type="number" placeholder="1000"><label>Uburyo bwo kwishyura</label><select><option>Mobile Money</option><option>MTN MoMo</option><option>Airtel Money</option></select><button onclick="sendMoney()">Ohereza amafaranga</button><p id="msg"></p></div></main>
<script>function sendMoney(){const p=document.getElementById('phone').value,a=document.getElementById('amount').value,m=document.getElementById('msg');if(!p||!a){m.textContent='Uzuza amakuru yose.';return}m.textContent='Byakiriwe: transaction izakorwa neza nyuma yo kongeramo payment/database.';}</script></body></html>
