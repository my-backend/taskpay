<!doctype html><meta charset=utf-8><title>Transactions</title><link rel=stylesheet href=style.css><main><div class=card><h2>Transactions</h2><div id=l></div></div></main><script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script><script src=config.js></script><script src=app.js></script><script>(async()=>{await loginRequired();let u=await me(),r=await db.from('transactions').select('*').eq('user_id',u.id).order('created_at',{ascending:false});l.innerHTML=r.data?.length?'<table><tr><th>Type</th><th>Amafaranga</th><th>Status</th></tr>'+r.data.map(x=>`<tr><td>${x.type}</td><td>${money(x.amount_rwf)}</td><td>${x.status}</td></tr>`).join('')+'</table>':'Nta transactions zirabaho.'})()</script>
