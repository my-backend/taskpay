<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TaskPay Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="card">
      <h1>Admin Panel</h1>

      <div id="status">Turimo kugenzura uburenganzira...</div>

      <div id="adminArea" style="display:none">
        <h2>Murakaza neza Admin</h2>
        <p>Ufite uburenganzira bwo gucunga TaskPay.</p>

        <p>
          <a href="index.html">← Subira kuri TaskPay</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const statusBox = document.getElementById("status");
    const adminArea = document.getElementById("adminArea");

    function showError(message) {
      statusBox.innerHTML =
        '<strong>Ikibazo:</strong><br>' + message;
    }

    async function checkAdmin() {
      try {
        if (!window.TASKPAY_CONFIG) {
          showError("config.js ntabwo yabonetse.");
          return;
        }

        if (!window.TASKPAY_CONFIG.SUPABASE_URL) {
          showError("SUPABASE_URL ibura muri config.js.");
          return;
        }

        if (!window.TASKPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY) {
          showError("SUPABASE_PUBLISHABLE_KEY ibura muri config.js.");
          return;
        }

        if (!window.supabase) {
          showError("Supabase library ntabwo yapakiwe.");
          return;
        }

        const client = window.supabase.createClient(
          window.TASKPAY_CONFIG.SUPABASE_URL,
          window.TASKPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY
        );

        statusBox.textContent = "Turimo kugenzura login...";

        const sessionResult = await Promise.race([
          client.auth.getSession(),
          new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("Supabase yatwaye igihe kinini cyane.")),
              10000
            )
          )
        ]);

        const session = sessionResult.data?.session;

        if (!session) {
          showError(
            'Nta login yabonetse. <a href="login.html">Injira muri TaskPay</a>.'
          );
          return;
        }

        statusBox.textContent = "Turimo kugenzura Admin...";

        const adminResult = await Promise.race([
          client.rpc("is_admin"),
          new Promise((_, reject) =>
            setTimeout(
              () => reject(new Error("Is_admin yatwaye igihe kinini cyane.")),
              10000
            )
          )
        ]);

        if (adminResult.error) {
          console.error("Admin error:", adminResult.error);
          showError(
            "Supabase yanze kugenzura Admin.<br><br>" +
            adminResult.error.message
          );
          return;
        }

        if (adminResult.data !== true) {
          showError(
            "Nturi admin. Konti yawe ntabwo yemerewe gufungura Admin Panel."
          );
          return;
        }

        statusBox.textContent = "";
        adminArea.style.display = "block";

      } catch (error) {
        console.error("TaskPay Admin error:", error);

        showError(
          (error && error.message)
            ? error.message
            : "Habaye ikibazo kitazwi."
        );
      }
    }

    checkAdmin();
  </script>
</body>
</html>
