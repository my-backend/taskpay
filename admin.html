<!doctype html>
<html lang="rw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TaskPay Admin</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="card">
      <h1>Admin Panel</h1>

      <div id="status">Turimo kugenzura uburenganzira...</div>

      <div id="adminArea" style="display:none">
        <h2>Murakaza neza Admin</h2>

        <p>Ufite uburenganzira bwo gucunga TaskPay.</p>

        <p>
          <a href="index.html">← Subira kuri TaskPay</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    const client = window.supabase.createClient(
      window.TASKPAY_CONFIG.SUPABASE_URL,
      window.TASKPAY_CONFIG.SUPABASE_PUBLISHABLE_KEY
    );

    const statusBox = document.getElementById("status");
    const adminArea = document.getElementById("adminArea");

    async function checkAdmin() {
      const {
        data: { session }
      } = await client.auth.getSession();

      if (!session) {
        statusBox.innerHTML =
          'Ugomba kubanza kwinjira. <a href="login.html">Injira hano</a>.';
        return;
      }

      const { data, error } = await client.rpc("is_admin");

      if (error) {
        console.error(error);
        statusBox.textContent =
          "Habaye ikibazo mu kugenzura uburenganzira.";
        return;
      }

      if (data !== true) {
        statusBox.textContent =
          "Nturi admin. Nta burenganzira bwo kwinjira muri Admin Panel.";
        return;
      }

      statusBox.textContent = "";
      adminArea.style.display = "block";
    }

    checkAdmin();
  </script>
</body>
</html>
