<!doctype html>
<html lang="rw">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskPay - Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f7fc;color:#172033}
header{background:#087ff5;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:800}nav{background:#fff;padding:10px;display:flex;gap:8px;overflow:auto;position:sticky;top:0;z-index:2}
nav a{padding:11px 15px;border-radius:12px;text-decoration:none;color:#19304d;white-space:nowrap}nav a.active,nav a:hover{background:#087ff5;color:#fff}
main{max-width:900px;margin:auto;padding:20px}.welcome,.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #17345b12}
.balance{background:linear-gradient(135deg,#087ff5,#075bd6);color:#fff}.balance h1{font-size:42px;margin:8px 0 20px}
button,.btn{border:0;background:#fff;color:#0873dd;padding:13px 18px;border-radius:14px;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.item{padding:18px;border:1px solid #e4eaf2;border-radius:18px;background:#fff}.money{font-weight:800;color:#0873dd}
h2{margin-top:0}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header><div class="logo">▣ TaskPay</div><div>🔔</div></header>
<nav>
<a class="active" href="index.html">Dashboard</a><a href="users.html">Abakoresha</a><a href="tasks.html">Akazi</a><a href="withdraw.html">Ohereza</a><a href="admin.html">Admin</a>
</nav>
<main>
<section class="welcome"><h2>Murakaza neza!</h2><p>Kora akazi, urangize tasks, ubone amafaranga.</p></section>
<section class="card balance"><div>Konti yawe</div><h1 id="balance">RWF 45,000</h1><a class="btn" href="withdraw.html">Gukuramo amafaranga</a></section>
<div class="grid">
<a class="item" href="tasks.html" style="text-decoration:none;color:inherit">📋<h3>Akazi</h3><p>Reba tasks nshya</p></a>
<a class="item" href="withdraw.html" style="text-decoration:none;color:inherit">💸<h3>Ohereza</h3><p>Ohereza amafaranga</p></a>
<a class="item" href="users.html" style="text-decoration:none;color:inherit">👥<h3>Abakoresha</h3><p>Reba konti</p></a>
<a class="item" href="admin.html" style="text-decoration:none;color:inherit">⚙️<h3>Admin</h3><p>Gucunga TaskPay</p></a>
</div>
</main></body></html>
