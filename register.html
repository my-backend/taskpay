<!doctype html><meta charset=utf-8><title>TaskPay Register</title><link rel=stylesheet href=style.css><main><div class=card><h1>TaskPay</h1><h2>Iyandikishe</h2><input id=n placeholder=Amazina><input id=ph placeholder=Telefoni><input id=e type=email placeholder=Email><input id=p type=password placeholder=Password><button onclick=go()>Fungura konti</button><p id=m></p></div></main><script src=https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2></script><script src=config.js></script><script src=app.js></script><script>async function go(){let r=await db.auth.signUp({email:e.value,password:p.value,options:{data:{full_name:n.value,phone:ph.value}}});m.textContent=r.error?r.error.message:'Konti yakozwe. Reba email niba verification isabwa.'}</script>
